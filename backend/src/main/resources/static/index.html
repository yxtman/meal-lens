<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealLens Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 780px;
            margin: 32px auto;
            padding: 0 16px;
            background: #f7faf7;
            color: #202020;
        }
        h1 { color: #256f3c; }
        form, .result {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            margin-top: 18px;
            padding: 10px 18px;
            background: #256f3c;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .foods div { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
        .foods input { width: 100px; }
        .result { margin-top: 20px; }
        .result ul { padding-left: 20px; }
        .camera { margin-bottom: 20px; }
        .camera video,
        .camera img {
            width: 100%;
            max-height: 320px;
            border-radius: 8px;
            background: #e8e8e8;
        }
        .camera-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .camera-actions button { margin-top: 10px; }
        #photo-status { margin-top: 8px; color: #666; }
    </style>
</head>
<body>
<h1>MealLens 餐食分析 Demo</h1>
<form id="analysis-form">
    <h3>拍摄这一餐</h3>
    <div class="camera">
        <video id="camera-preview" autoplay playsinline muted></video>
        <img id="photo-preview" alt="拍摄的餐食照片" style="display: none;">
        <div class="camera-actions">
            <button type="button" id="start-camera">开启摄像头</button>
            <button type="button" id="take-photo" disabled>拍照</button>
            <button type="button" id="retake-photo" disabled>重拍</button>
            <button type="button" id="choose-photo">从相册选择</button>
            <input type="file" id="photo-file" accept="image/*" capture="environment" hidden>
        </div>
        <p id="photo-status">还没拍照。</p>
    </div>

    <label>性别
        <select id="gender">
            <option value="male">男</option>
            <option value="female">女</option>
        </select>
    </label>
    <label>年龄 <input type="number" id="age" value="21" min="1"></label>
    <label>身高 cm <input type="number" id="height" value="175" min="1"></label>
    <label>体重 kg <input type="number" id="weight" value="70" min="1"></label>
    <label>目标
        <select id="goal">
            <option value="lose">减脂</option>
            <option value="keep">保持</option>
            <option value="gain">增肌</option>
        </select>
    </label>
    <label>活动量
        <select id="activity">
            <option value="sedentary">久坐</option>
            <option value="light" selected>轻度活动</option>
            <option value="moderate">中度活动</option>
            <option value="high">高强度</option>
        </select>
    </label>
    <h3>选择这一餐的食物</h3>
    <div class="foods" id="foods"></div>
    <button type="submit">分析这一餐</button>
</form>
<div class="result" id="result" style="display: none;"></div>
<script>
    const foodsDiv = document.getElementById('foods');
    const cameraPreview = document.getElementById('camera-preview');
    const photoPreview = document.getElementById('photo-preview');
    const startCameraButton = document.getElementById('start-camera');
    const takePhotoButton = document.getElementById('take-photo');
    const retakePhotoButton = document.getElementById('retake-photo');
    const choosePhotoButton = document.getElementById('choose-photo');
    const photoFileInput = document.getElementById('photo-file');
    const photoStatus = document.getElementById('photo-status');

    let foods = [];
    let photoDataUrl = null;
    let cameraStream = null;

    function stopCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }
        cameraPreview.style.display = 'none';
        takePhotoButton.disabled = true;
        startCameraButton.disabled = false;
    }

    async function startCamera() {
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' },
                audio: false
            });
            cameraPreview.srcObject = cameraStream;
            cameraPreview.style.display = 'block';
            photoPreview.style.display = 'none';
            photoStatus.textContent = '摄像头已开启，点击“拍照”。';
            startCameraButton.disabled = true;
            takePhotoButton.disabled = false;
            retakePhotoButton.disabled = false;
        } catch (error) {
            photoStatus.textContent = '无法开启摄像头：' + error.message;
        }
    }

    function takePhoto() {
        const canvas = document.createElement('canvas');
        canvas.width = cameraPreview.videoWidth;
        canvas.height = cameraPreview.videoHeight;
        canvas.getContext('2d').drawImage(cameraPreview, 0, 0);
        photoDataUrl = canvas.toDataURL('image/jpeg', 0.9);
        photoPreview.src = photoDataUrl;
        photoPreview.style.display = 'block';
        stopCamera();
        photoStatus.textContent = '照片已拍摄，请在下方确认食物。';
    }

    function retakePhoto() {
        photoDataUrl = null;
        photoPreview.removeAttribute('src');
        photoPreview.style.display = 'none';
        photoStatus.textContent = '还没拍照。';
        startCamera();
    }

    startCameraButton.addEventListener('click', startCamera);
    takePhotoButton.addEventListener('click', takePhoto);
    retakePhotoButton.addEventListener('click', retakePhoto);
    choosePhotoButton.addEventListener('click', () => photoFileInput.click());
    photoFileInput.addEventListener('change', event => {
        const file = event.target.files[0];
        if (!file) {
            return;
        }
        const reader = new FileReader();
        reader.onload = () => {
            photoDataUrl = reader.result;
            photoPreview.src = photoDataUrl;
            photoPreview.style.display = 'block';
            photoStatus.textContent = '照片已选择，请在下方确认食物。';
        };
        reader.readAsDataURL(file);
    });

    fetch('/api/foods')
        .then(response => response.json())
        .then(data => {
            foods = data;
            foods.forEach(food => {
                const row = document.createElement('div');
                row.innerHTML = `
                    <input type="checkbox" id="food-${food.id}" value="${food.id}">
                    <label for="food-${food.id}" style="margin:0;font-weight:normal;">
                        ${food.name}（默认 ${food.defaultGrams}g）
                    </label>
                    <input type="number" id="grams-${food.id}" value="${food.defaultGrams}" min="1">
                `;
                foodsDiv.appendChild(row);
            });
        });

    document.getElementById('analysis-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const selectedFoods = foods
            .map(food => {
                const checkbox = document.getElementById(`food-${food.id}`);
                const gramsInput = document.getElementById(`grams-${food.id}`);
                if (checkbox.checked && gramsInput.value) {
                    return { foodId: food.id, grams: Number(gramsInput.value) };
                }
                return null;
            })
            .filter(item => item !== null);

        const body = {
            userProfile: {
                gender: document.getElementById('gender').value,
                age: Number(document.getElementById('age').value),
                heightCm: Number(document.getElementById('height').value),
                weightKg: Number(document.getElementById('weight').value),
                goal: document.getElementById('goal').value,
                activityLevel: document.getElementById('activity').value
            },
            foods: selectedFoods
        };

        const response = await fetch('/api/analysis', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const result = await response.json();
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
            <h2>这一餐分析</h2>
            ${photoDataUrl ? `<img src="${photoDataUrl}" alt="餐食照片" style="width:100%;border-radius:8px;">` : ''}
            <p><strong>总热量：</strong>${result.mealKcal} kcal</p>
            <p><strong>蛋白质：</strong>${result.protein} g</p>
            <p><strong>碳水：</strong>${result.carb} g</p>
            <p><strong>脂肪：</strong>${result.fat} g</p>
            <p><strong>今日目标：</strong>${result.dailyTargetKcal} kcal</p>
            <p><strong>剩余热量：</strong>${result.remainingKcal} kcal</p>
            <p><strong>这一餐占今日目标：</strong>${result.percentOfDay}%</p>
            <h3>食物明细</h3>
            <ul>
                ${result.foodReports.map(item => `<li>${item.name}：${item.grams}g，${item.kcal} kcal</li>`).join('')}
            </ul>
            <h3>建议</h3>
            <ul>
                ${result.suggestions.map(item => `<li>${item}</li>`).join('')}
            </ul>
        `;
    });
</script>
</body>
</html>
